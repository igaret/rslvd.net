# rslvd.net nginx config — wildcard SSL

# ── Main app: rslvd.net and www ──────────────────────────────────────────────
server {
    server_name rslvd.net www.rslvd.net;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Tunnel subdomains: *.rslvd.net → tunnel proxy on 8080 ────────────────────
server {
    server_name *.rslvd.net ~^.+\..+\.rslvd\.net$;

    client_max_body_size 0;       # let the tunnel handle it
    proxy_request_buffering off;  # stream request body immediately
    proxy_buffering off;          # stream response immediately

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long-lived WS connections
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect for everything ─────────────────────────────────────
server {
    listen 80;
    server_name rslvd.net www.rslvd.net *.rslvd.net ~^.+\..+\.rslvd\.net$;
    return 301 https://$host$request_uri;
}
