# ── ns1.rslvd.net → Technitium DNS admin console (reverse proxy) ─────────────
# Exact server_name match takes priority over the *.rslvd.net wildcard block.
# HTTP → HTTPS, then proxy the console (localhost:5380) over the wildcard cert.
server {
    listen 80;
    server_name ns1.rslvd.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ns1.rslvd.net;

    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5380;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Main site: rslvd.net (HTTPS) ─────────────────────────────────────────────
server {
    server_name rslvd.net www.rslvd.net;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location ~ \.(aspx|php|jsp|cgi|asp)$ {
        return 200;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /dl/ {
        alias /opt/rslvd/public/dl/;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Single-level subdomains *.rslvd.net (HTTPS) → TUNNEL PROXY on 8080 ───────
server {
    server_name *.rslvd.net;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Per-FQDN HTTP fallback configs (generated by enable-http-fallback.sh) ─────
# When a user sets force_https=false, a per-FQDN config is written here.
# nginx exact server_name match takes priority over the wildcard redirect below.
include /etc/nginx/conf.d/rslvd-http/*.conf;

# ── Nested subdomains *.*.rslvd.net: HTTP only, NO redirect → TUNNEL PROXY ───
# This block MUST come before the redirect block so nginx matches it first
server {
    listen 80;
    server_name ~^.+\..+\.rslvd\.net$;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location ~ \.(aspx|php|jsp|cgi|asp)$ {
        return 200;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── HTTP → HTTPS redirect for main site + single-level subs ─────────────────
# Per-FQDN HTTP configs (above) take priority over this wildcard for opt-out subs.
server {
    listen 80;
    server_name rslvd.net www.rslvd.net ~^[^.]+\.rslvd\.net$;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
