# rslvd.net nginx config — wildcard SSL + auto-SSL for nested subdomains
#
# Architecture:
#   - rslvd.net / www → Express app on :3001 (HTTPS, wildcard cert)
#   - *.rslvd.net (first-level) → tunnel proxy on :8080 (HTTPS, wildcard cert)
#   - *.*.rslvd.net (nested) → tunnel proxy on :8080
#     - If per-domain cert exists: HTTPS (from /etc/nginx/conf.d/rslvd-certs/*.conf)
#     - If no cert yet: served over HTTP (no redirect) as fallback
#
# Per-subdomain SSL configs are auto-generated by the app when a nested
# subdomain is created (certbot DNS-01 via IONOS API).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Main app: rslvd.net and www ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name rslvd.net www.rslvd.net;

    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── First-level tunnel subdomains: *.rslvd.net → tunnel proxy (HTTPS) ────────
# These are covered by the *.rslvd.net wildcard certificate.
server {
    listen 443 ssl http2;
    server_name *.rslvd.net;

    ssl_certificate /etc/letsencrypt/live/rslvd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rslvd.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Auto-generated per-subdomain SSL configs (nested subdomains) ─────────────
# Each nested subdomain gets its own server block with individual cert after
# provisioning. These are generated by the app's ssl.js module.
include /etc/nginx/conf.d/rslvd-certs/*.conf;

# ── HTTP handling ─────────────────────────────────────────────────────────────

# Main site + first-level subdomains: always redirect to HTTPS
# (covered by wildcard cert, so HTTPS always works)
server {
    listen 80;
    server_name rslvd.net www.rslvd.net *.rslvd.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Nested subdomains: serve over HTTP as fallback (no redirect)
# Once a cert is provisioned, the per-domain HTTPS server block above takes
# priority and browsers will use HTTPS. Until then, traffic works over HTTP.
server {
    listen 80;
    server_name ~^.+\..+\.rslvd\.net$;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
