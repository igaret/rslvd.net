<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rslvd.net — Dynamic DNS</title>
  <meta name="description" content="Fast, reliable Dynamic DNS service. Keep your domains pointing to your home IP, always." />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="rslvd.net" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #1a1a24;
      --border: #2a2a3a;
      --border2: #3a3a4a;
      --text: #e8e8f0;
      --text2: #9090a8;
      --text3: #606078;
      --accent: #6c63ff;
      --accent2: #8b84ff;
      --accent-bg: rgba(108,99,255,0.12);
      --green: #22c55e;
      --green-bg: rgba(34,197,94,0.1);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.1);
      --yellow: #f59e0b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    #root { min-height: 100vh; }

    /* Typography */
    h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: 'JetBrains Mono', monospace; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,99,255,0.3); }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: white; }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .btn-lg { padding: 14px 28px; font-size: 16px; }

    /* Inputs */
    .input {
      width: 100%; padding: 10px 14px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
      transition: border-color 0.15s; outline: none;
      font-family: 'Inter', sans-serif;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
    .input::placeholder { color: var(--text3); }

    /* Cards */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-yellow { background: rgba(245,158,11,0.1); color: var(--yellow); }
    .badge-purple { background: var(--accent-bg); color: var(--accent2); }
    .badge-gray { background: rgba(255,255,255,0.05); color: var(--text2); }

    /* Nav */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.8); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .nav-logo span { color: var(--accent2); }
    .nav-links { display: flex; align-items: center; gap: 16px; }

    /* Hero */
    .hero {
      text-align: center; padding: 100px 24px 80px;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(108,99,255,0.15), transparent);
    }
    .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 700; letter-spacing: -1px; margin-bottom: 20px; }
    .hero p { font-size: 18px; color: var(--text2); max-width: 560px; margin: 0 auto 36px; }

    /* Pricing */
    .pricing-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; max-width: 960px; margin: 0 auto; padding: 0 24px;
    }
    .pricing-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; text-align: center; position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .pricing-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .pricing-card.popular { border-color: var(--accent); }
    .popular-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: white; padding: 4px 14px;
      border-radius: 999px; font-size: 12px; font-weight: 600;
    }
    .price-amount { font-size: 2.5rem; font-weight: 700; color: var(--text); margin: 12px 0 4px; }
    .price-period { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
    .price-features { list-style: none; text-align: left; margin-bottom: 24px; }
    .price-features li { padding: 6px 0; font-size: 14px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
    .price-features li::before { content: '✓'; color: var(--green); font-weight: 700; }

    /* Dashboard */
    .dashboard { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--text); }

    /* Host table */
    .host-table { width: 100%; border-collapse: collapse; }
    .host-table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    .host-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .host-table tr:last-child td { border-bottom: none; }
    .host-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
    .form-error { font-size: 13px; color: var(--red); margin-top: 6px; }
    .form-hint { font-size: 12px; color: var(--text3); margin-top: 4px; }

    /* Auth */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 420px; }
    .auth-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .auth-subtitle { color: var(--text2); margin-bottom: 28px; font-size: 15px; }

    /* Alert */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .alert-error { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .alert-success { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .alert-info { background: var(--accent-bg); color: var(--accent2); border: 1px solid rgba(108,99,255,0.3); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px;
    }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

    /* Copy box */
    .copy-box {
      display: flex; align-items: center;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .copy-box-text { flex: 1; padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .copy-box button { padding: 10px 14px; background: var(--bg3); border: none; border-left: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 13px; white-space: nowrap; }
    .copy-box button:hover { color: var(--text); background: var(--border); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-label { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* Util */
    .flex { display: flex; }
    .flex-center { display: flex; align-items: center; justify-content: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .text-sm { font-size: 13px; }
    .text-center { text-align: center; }
    .text-muted { color: var(--text2); }
    .w-full { width: 100%; }
    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    /* Connect steps */
    .connect-step { display: flex; gap: 16px; margin-bottom: 16px; align-items: flex-start; }
    .connect-step:last-child { margin-bottom: 0; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
    .step-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn.active { border-color: var(--accent2); color: var(--accent2); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }

    /* Responsive */
    @media (max-width: 640px) {
      .nav { padding: 14px 16px; }
      .hero { padding: 64px 16px 48px; }
      .pricing-grid { grid-template-columns: 1fr; }
      .host-table th:nth-child(3), .host-table td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app2.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
